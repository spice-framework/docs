name: Documentation verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout documentation portal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read exact development commit
        id: source-lock
        shell: bash
        run: |
          commit="$(node -p "require('./sources/ecosystem.lock.json').catalog.commit")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "development=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout exact snapshot materializer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spice-framework/development
          ref: ${{ steps.source-lock.outputs.development }}
          path: .generated/tools/development
          persist-credentials: false

      - name: Configure exact Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Materialize exact ecosystem snapshot
        working-directory: .generated/tools/development
        env:
          GOTOOLCHAIN: local
        run: >-
          go run ./cmd/spice-dev snapshot materialize
          --lock "$GITHUB_WORKSPACE/sources/ecosystem.lock.json"
          --root "$GITHUB_WORKSPACE/.generated/sources"

      - name: Configure exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete portal verification
        run: pnpm verify

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-verification-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
