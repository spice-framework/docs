name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout documentation portal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Read exact development commit
        id: source-lock
        shell: bash
        run: |
          commit="$(node -p "require('./sources/ecosystem.lock.json').catalog.commit")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "development=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout exact snapshot materializer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spice-framework/development
          ref: ${{ steps.source-lock.outputs.development }}
          path: .generated/tools/development
          persist-credentials: false

      - name: Configure exact Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Materialize exact ecosystem snapshot
        working-directory: .generated/tools/development
        env:
          GOTOOLCHAIN: local
        run: >-
          go run ./cmd/spice-dev snapshot materialize
          --lock "$GITHUB_WORKSPACE/sources/ecosystem.lock.json"
          --root "$GITHUB_WORKSPACE/.generated/sources"

      - name: Configure exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify exact deployment tree
        run: pnpm verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
