name: Documentation DNS

on:
  pull_request:
    branches: [main]
    paths:
      - infra/dns/**
      - .github/workflows/dns.yml
  push:
    branches: [main]
    paths:
      - infra/dns/**
      - .github/workflows/dns.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-dns
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra/dns fmt -check -recursive
      - name: Initialize without backend
        run: terraform -chdir=infra/dns init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=infra/dns validate

  apply:
    name: Apply DNS-only records
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dns-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Sign in through the user-assigned managed identity
        uses: Azure/login@858f4093d287a904987dfd22abd163280f939550 # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read Cloudflare token from the authorized secret only
        shell: bash
        run: |
          token="$(az keyvault secret show --vault-name ol-shared-kv --name spice-framework-cloudflare-api-key --query value -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          if [[ -n "${PAGES_VERIFICATION:-}" ]]; then
            echo "TF_VAR_github_pages_verification=$PAGES_VERIFICATION" >> "$GITHUB_ENV"
          fi
        env:
          PAGES_VERIFICATION: ${{ vars.PAGES_VERIFICATION }}
      - name: Configure Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false
      - name: Initialize isolated Azure state
        run: terraform -chdir=infra/dns init -input=false
      - name: Plan DNS changes
        run: terraform -chdir=infra/dns plan -input=false -out=docs-dns.tfplan
      - name: Apply reviewed DNS plan
        run: terraform -chdir=infra/dns apply -input=false -auto-approve docs-dns.tfplan
